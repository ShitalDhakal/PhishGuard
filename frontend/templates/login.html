<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Signup Page</title>
</head>
<body>
   <a href="/analystLogin">Analyst Login</a>
   <a href="/userLogin">User Login</a>
   <a href="/adminLogin">Admin Login</a>
</body>
</html>
{% load static %} <script src="{% static 'jquery.js' %}"></script>
{% load static %} <script src="{% static 'custom.js' %}"></script>

<script>
    $(document).ready(async function(){
    let adminCount = parseInt(await AjaxCallWithoutParm("/checkAdminCount")) || 0;
    if(adminCount <= 0){
        alert("No admins");
        window.location.href = "/adminSignup";
    }
});
</script>
