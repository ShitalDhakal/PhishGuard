<div class="row">
    <div class="col-md-2">
        <label class="form-label p-0">Email</label>
        <select class="form-select form-select-sm" id="userFilter">
        </select>
    </div>
    <div class="col-md-2">
        <label class="form-label p-0">IOC Type</label>
        <select class="form-select form-select-sm" id="ioc_type">
            <option value="">All</option>
            <option value="url">URL</option>
            <option value="domain">Domain</option>
            <option value="email">Email</option>
            <option value="hash">Hash</option>
        </select>
    </div>
    <div class="col-md-2">
        <label class="form-label p-0">Verdict</label>
        <select class="form-select form-select-sm" id="ioc_verdict">
            <option value = "">All</option>
            <option value = "safe">Safe</option>
            <option value = "malicious">Malicious</option>
            <option value = "unscanned">Unscanned</option>
        </select>
    </div>
    <div class="col-md-3">
        <label class="form-label p-0">Search Text</label>
        <input type="text" class="form-control form-control-sm" id="ioc_search_text" placeholder="Search Text...">
    </div>
    <div class="col-md-2 text-end">
        <button class="btn btn-sm btn-primary mt-4" id="ioc_search_btn"><i class="bi bi-search"></i> Search</button>
    </div>

    <div class="col-md-12 mt-3 table-responsive">
        <table class="table table-sm table-fixed table-responsive table-bordered table-hover" id="ioc_table">
            <thead>
                <tr>
                    <th>IOC Type</th>
                    <th>Value</th>
                    <th>Malicious</th>
                    <th>File Hash</th>   
                    <th>Reoccurance</th>
                </tr>
            </thead>
            <tbody id="ioc_table_body">
            </tbody>
        </table>
    </div>
</div>
